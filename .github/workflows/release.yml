name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
      - name: Configure & Build
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DNCE_BUILD_TESTS=ON
          cmake --build build -j 4
      - name: Run Unit Tests
        run: ./build/bin/engine_tests.exe
      - name: Package Windows Binaries
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $dir = "NCE-$tag-windows-x64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item build/bin/nce_gui.exe, build/bin/memscan_cli.exe, build/bin/nce_veh.dll, build/bin/target_dummy.exe, LICENSE, README.md -Destination $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: NCE-*-windows-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Configure & Build
        run: |
          cmake -S . -B build -DNCE_BUILD_TESTS=ON
          cmake --build build -j 4
      - name: Run Unit Tests
        run: ./build/bin/engine_tests
      - name: Package Linux Binaries
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          DIR="NCE-${TAG}-linux-x64"
          mkdir -p "$DIR"
          cp build/bin/memscan_cli build/bin/target_dummy LICENSE README.md "$DIR/"
          tar -czf "${DIR}.tar.gz" "$DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: NCE-*-linux-x64.tar.gz

  publish-release:
    needs: [ build-windows, build-linux ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" dist/* \
              --repo "${{ github.repository }}" \
              --title "New-Cheat-Engine $TAG" \
              --generate-notes
          fi
